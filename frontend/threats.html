{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Threats - AI Deception Intelligence Platform</title>

    <meta name="view-transition" content="same-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body>

    <header style="display: flex; align-items: center; gap: 12px;">
        <i data-lucide="shield-alert" style="color: #4ade80; width: 32px; height: 32px;"></i>
        <h1>AI Deception Intelligence Platform</h1>
    </header>


    <nav>

        <a href="{% url 'dashboard' %}"
   class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
    Dashboard
</a>

<a href="{% url 'threats' %}"
   class="{% if request.resolver_match.url_name == 'threats' %}active{% endif %}">
    Threats
</a>

<a href="{% url 'attackers' %}"
   class="{% if request.resolver_match.url_name == 'attackers' %}active{% endif %}">
    Attackers
</a>

    </nav>


    <main>

        <section class="content-section">

            <h2>Detected Threats</h2>

            <div id="threat-list">

                <p>
                    Loading threats...
                </p>

            </div>

        </section>

    </main>


    <script>

        const API_URL =
            "http://127.0.0.1:8000/api/events/?format=json";


        async function loadThreats() {

            const container =
                document.getElementById("threat-list");

            try {

                const response =
                    await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(
                        "HTTP error " + response.status
                    );
                }

                const events =
                    await response.json();


                container.innerHTML = "";


                if (events.length === 0) {

                    container.innerHTML = `
                <p>
                    No threats detected.
                </p>
            `;

                    return;
                }


                events.forEach(event => {

                    let threatName =
                        getThreatName(event);

                    let severity =
                        getSeverity(event);

                    let risk =
                        getRisk(event);


                    const card = document.createElement("div");

                    card.className = "threat-card";


                    card.innerHTML = `

                <div>

                    <h3>
                        ${getThreatIcon(severity)}
                        ${threatName}
                    </h3>

                    <p>
                        ${getThreatDescription(event)}
                    </p>

                    <small>
                        User: ${event.user}<br>
                        Source IP: ${event.source_ip}<br>
                        Asset: ${event.asset}<br>
                        Time: ${formatTimestamp(event.timestamp)}
                    </small>

                </div>


                <div>

                    <strong>
                        Risk: ${risk}/100
                    </strong>

                    <small>
                        ${severity}
                    </small>

                </div>

            `;


                    container.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "Threat loading error:",
                    error
                );

                container.innerHTML = `
            <p>
                Could not load threats from Django.
            </p>
        `;
            }
        }


        /* =====================================================
           Determine Threat Name
           ===================================================== */

        function getThreatName(event) {

            if (
                event.asset === "fake_api_key" ||
                event.event_type === "honeytoken_access"
            ) {

                return "Credential Theft";

            }


            if (
                event.asset === "salary.xlsx" ||
                event.event_type === "fake_document"
            ) {

                return "Suspicious File Access";

            }


            if (event.action === "scan") {

                return "Administrative API Scanning";

            }


            return "Suspicious Activity";
        }


        /* =====================================================
           Determine Description
           ===================================================== */

        function getThreatDescription(event) {

            if (
                event.asset === "fake_api_key" ||
                event.event_type === "honeytoken_access"
            ) {

                return "Honeytoken accessed by suspicious source";

            }


            if (
                event.asset === "salary.xlsx" ||
                event.event_type === "fake_document"
            ) {

                return "Fake confidential document accessed";

            }


            if (event.action === "scan") {

                return "Administrative API scanning detected";

            }


            return "Suspicious security activity detected";
        }


        /* =====================================================
           Determine Severity
           ===================================================== */

        function getSeverity(event) {

            if (event.severity) {

                return event.severity.toUpperCase();

            }


            if (
                event.asset === "fake_api_key"
            ) {

                return "CRITICAL";

            }


            if (
                event.asset === "salary.xlsx" ||
                event.action === "scan"
            ) {

                return "HIGH";

            }


            return "MEDIUM";
        }


        /* =====================================================
           Determine Risk
           ===================================================== */

        function getRisk(event) {

            if (
                event.asset === "fake_api_key"
            ) {

                return 40;

            }


            if (
                event.asset === "salary.xlsx"
            ) {

                return 30;

            }


            if (
                event.action === "scan"
            ) {

                return 30;

            }


            return 10;
        }


        /* =====================================================
           Threat Icon
           ===================================================== */

        function getThreatIcon(severity) {

            if (severity === "CRITICAL") {
                return "<i data-lucide='alert-circle' style='color: #ef4444; width: 16px; height: 16px; display: inline-block; vertical-align: middle;'></i>";
            }

            if (severity === "HIGH") {
                return "<i data-lucide='alert-triangle' style='color: #f97316; width: 16px; height: 16px; display: inline-block; vertical-align: middle;'></i>";
            }

            if (severity === "MEDIUM") {
                return "<i data-lucide='alert-triangle' style='color: #eab308; width: 16px; height: 16px; display: inline-block; vertical-align: middle;'></i>";
            }

            return "<i data-lucide='info' style='color: #3b82f6; width: 16px; height: 16px; display: inline-block; vertical-align: middle;'></i>";
        }


        /* =====================================================
           Timestamp
           ===================================================== */

        function formatTimestamp(timestamp) {

            if (!timestamp) {
                return "Unknown";
            }

            const date =
                new Date(timestamp);

            return date.toLocaleString();

        }


        /* =====================================================
           Start
           ===================================================== */

        loadThreats().then(() => {
            lucide.createIcons();
        });

    </script>


</body>

</html>
